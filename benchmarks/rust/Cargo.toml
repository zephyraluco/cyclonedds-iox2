[package]
name = "shm-bench-rust"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[profile.release]
debug = true

[dependencies]
eclipse-cyclonedds-sys = { git = "https://github.com/eclipse-cyclonedds/cyclonedds-rust.git", rev = "ef0dd5cc1477b29449aba1f717d9496db5953b2a" }
eclipse-cyclonedds = { git = "https://github.com/eclipse-cyclonedds/cyclonedds-rust.git", rev = "ef0dd5cc1477b29449aba1f717d9496db5953b2a", features = ["internal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
